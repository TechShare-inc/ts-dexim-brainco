[project]
name = "dexim-brainco"
version = "0.1.0"
description = "BrainCo Revo2 dexterous hand — model, interface, and teleoperation control node"
readme = "README.md"
authors = [
    { name = "haoyan.li", email = "haoyan.li@techshare.co.jp" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.0",
    "loguru>=0.7.0",
    "dexim-core>=0.1.0",
    "dexim-cli-common>=0.1.0",
    "rich-click>=1.8",
]

[project.scripts]
dexim-brainco = "dexim.brainco.cli:standalone_app"

[project.optional-dependencies]
hardware = [
    "bc-stark-sdk",
]
viz = [
    "pinocchio>=3.9.0",
    "viser>=0.2.0",
    "trimesh>=3.20.0",
    "scipy>=1.10.0",
]
kinematics = [
    "pinocchio>=3.9.0",
]
all = [
    "pinocchio>=3.9.0",
    "viser>=0.2.0",
    "trimesh>=3.20.0",
    "scipy>=1.10.0",
    "nlopt>=2.7.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dexim.brainco"
namespace = true

# ── Tool config ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: real BrainCo Revo2 hardware required — run manually",
    "requires_model: needs pinocchio/URDF assets — devenv only",
]

[tool.coverage.run]
omit = ["*/dexim/brainco/cli/*"]
