name: Locked offline package

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.84.2
          run-install: false
      # dexim-core and dexim-cli-common come from the private dexim repo; a
      # read-only deploy key lets uv's git fetch reach it over SSH.
      - name: Authorize the private dexim dependency
        shell: bash
        env:
          DEXIM_DEPLOY_KEY: ${{ secrets.DEXIM_DEPLOY_KEY }}
        run: |
          ssh_dir="$(cygpath -m "$HOME")/.ssh"
          mkdir -p "$ssh_dir"
          printf '%s\n' "$DEXIM_DEPLOY_KEY" > "$ssh_dir/dexim_deploy"
          chmod 600 "$ssh_dir/dexim_deploy"
          ssh-keyscan -t ed25519 github.com >> "$ssh_dir/known_hosts"
          git config --global core.sshCommand "ssh -i '$ssh_dir/dexim_deploy' -o IdentitiesOnly=yes -o UserKnownHostsFile='$ssh_dir/known_hosts'"
          git config --global url."git@github.com:TechShare-inc/dexim.git".insteadOf "https://github.com/TechShare-inc/dexim.git"
      - name: Install locked dependencies
        run: pixi install --locked
      - name: Run offline package tests
        run: pixi run --locked test
      - name: Build wheel
        run: pixi exec --spec uv==0.13.5 uv build --wheel
      - name: Test installed wheel
        run: pixi run --locked test-wheel
      - name: Preserve wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brainco-wheel-${{ github.sha }}
          path: dist/*.whl
